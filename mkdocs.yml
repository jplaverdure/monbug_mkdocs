site_name: MonBUG
site_dir: dist

plugins:
  - include-markdown
  - awesome-nav
  - search
  - social:
      cards_layout_options:
        background_color: "#22619a"
        font_family: Roboto
        logo: ../overrides/assets/images/logo.white.svg   # relative to en/ or fr/, where the build runs

extra:
  # Logo variants (see overrides/main.html). theme.logo (#94c0e9) is still used for the favicon; social cards use logo.white.svg.
  logo_on_light: assets/images/logo.blue.svg   # header/hero in light mode (#22619A)
  logo_on_dark: assets/images/logo.dark.svg    # header/hero in dark mode, and footer (#5793d0)
  social:
    - icon: fontawesome/brands/bluesky
      name: Bluesky
      link: https://bsky.app/profile/mon-bug.bsky.social
    - icon: fontawesome/brands/youtube
      name: YouTube
      link: https://www.youtube.com/@monbug5683
    - icon: fontawesome/brands/linkedin
      name: LinkedIn
      link: https://www.linkedin.com/company/monbug/

extra_css:
  - assets/styles/timeline.css
  - assets/styles/palette.css
  - assets/styles/general.css
  - assets/styles/image-gallery.css
  - assets/styles/monbug.css

extra_javascript:
  - assets/javascripts/external-links.js

markdown_extensions:
  - codehilite
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.extra
  - pymdownx.blocks.html

  - pymdownx.snippets:
      check_paths: True
      base_path: .
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

theme:
  name: material
  custom_dir: '../overrides/'
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  # Instrument Sans is self-hosted (assets/styles/InstrumentSans.woff2), see overrides/main.html
  font: false

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes

  palette:
    - media: "(prefers-color-scheme)"   # automatic: follows the system setting
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: octicons/sun-16
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: octicons/moon-16
        name: Switch to system setting
